version: '3.8'

services:
  api:
    image: hemal45/simple-node:latest
    container_name: node_backend_api
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      - NODE_ENV=production 
      - PORT=5000

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s